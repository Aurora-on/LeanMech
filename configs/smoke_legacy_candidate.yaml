dataset:
  source: local_archive
  limit: 1
  category: Mechanics
  sample_policy: index_head
  seed: 42
  local_archive:
    root: "../archive"
    mode: text_only
  single_image_only_for_mvp: true

model:
  provider: mock
  model_id: mock-legacy-smoke
  base_url: null
  api_key_env: OPENAI_API_KEY
  supports_vision: true
  timeout_s: 30
  max_retries: 1
  extra: {}

lean:
  enabled: false
  physlean_dir: "../physlib"
  timeout_s: 60
  lean_header: "import Physlib"
  preflight_enabled: false

knowledge:
  enabled: false

statement:
  generation_mode: legacy_candidate
  feedback_loop_enabled: false

semantic:
  pass_threshold: 0.7

proof:
  max_attempts: 2

prompts:
  dir: prompts
  a_extract_ir: A_extract_ir.txt
  b_generate_statements: B_generate_statements.txt
  b_revise_statements: B_revise_statements.txt
  d_semantic_rank: D_semantic_rank.txt
  e_plan_proof: E_plan_proof.txt
  e_generate_proof: E_generate_proof.txt
  e_repair_proof: E_repair_proof.txt

output:
  output_dir: outputs/latest
  runs_dir: runs
  tag: smoke-legacy-candidate
