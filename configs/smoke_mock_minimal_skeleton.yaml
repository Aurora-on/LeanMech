dataset:
  source: local_archive
  limit: 1
  category: Mechanics
  sample_policy: index_head
  seed: 42
  local_archive:
    root: "fixtures/local_archive_fixture"
    mode: text_only
  single_image_only_for_mvp: true

model:
  provider: mock
  model_id: mock-minimal-skeleton
  base_url: null
  api_key_env: OPENAI_API_KEY
  supports_vision: true
  timeout_s: 30
  max_retries: 1
  extra: {}

lean:
  enabled: false
  physlean_dir: "../physlib"
  mechlib_dir: "../MechLib"
  timeout_s: 60
  strict_blocklist: ["sorry", "admit", "axiom"]
  lean_header: "import MechLib"
  preflight_enabled: false

knowledge:
  enabled: false
  structured_context_enabled: false
  evidence_top_k: 8
  lean_check_decls: false

statement:
  library_target: mechlib
  with_mechlib_context: false
  feedback_loop_enabled: false
  max_revision_rounds: 0
  generation_mode: minimal_skeleton
  allow_explicit_gap_laws: true
  forbid_derived_equation_hypotheses: true
  require_hypothesis_provenance: true
  require_evidence_binding: true
  max_model_ir_candidates: 2
  max_sketch_steps: 12
  minimal_feedback_scope: routed_stage

semantic:
  pass_threshold: 0.7

proof:
  mode: auto
  legacy_fallback_enabled: false
  max_attempts: 2

prompts:
  dir: prompts

output:
  output_dir: outputs/latest
  runs_dir: runs
  tag: smoke-mock-minimal-skeleton

runtime:
  sample_concurrency: 1
